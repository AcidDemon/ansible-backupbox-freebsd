---
- name: Configure the restic ingest jail
  when: backup_restic_enabled | bool
  vars:
    _jail_root: "{{ jail_dataset_mount }}/{{ backup_restic_jail }}"
    _client_rows: "{{ backup_clients | selectattr('services', 'contains', 'restic') | list }}"
  block:
    # No sshd in this jail at all. rest-server speaks HTTP, which is also the
    # only way to get restic's append-only guarantee - it has none over sftp.
    - name: Install rest-server in the jail
      community.general.pkgng:
        name: rest-server
        state: present
        rootdir: "{{ _jail_root }}"
      environment: "{{ jail_pkg_environment }}"
      register: _restic_pkg

    # pkg -r writes the files but runs no post-install step inside the jail, so
    # the jail's linker hints never learn about /usr/local/lib. Without this,
    # anything linked against a package library dies with
    # "Shared object ... not found" even though the file is right there.
    - name: Refresh the jail linker hints
      ansible.builtin.command: "jexec {{ backup_restic_jail }} /etc/rc.d/ldconfig restart"
      changed_when: true
      when: _restic_pkg is changed

    - name: Refuse to configure a restic client with no password in vault
      ansible.builtin.assert:
        that: item.name in (vault_restic_passwords | default({}))
        fail_msg: "No vault_restic_passwords entry for '{{ item.name }}'."
        quiet: true
      loop: "{{ _client_rows }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true

    # rest-server drops privileges to its own account, which exists only inside
    # the jail, so the host has to chown its data numerically.
    - name: Read the restserver uid from inside the jail
      ansible.builtin.command: "pw -R {{ _jail_root }} usershow {{ backup_restic_user }}"
      register: _restserver_pw
      changed_when: false

    - name: Create the per-client repository directories
      ansible.builtin.file:
        path: "{{ backup_root }}/{{ backup_restic_jail }}/{{ item.name }}"
        state: directory
        owner: "{{ _restserver_pw.stdout.split(':')[2] }}"
        group: "{{ _restserver_pw.stdout.split(':')[3] }}"
        mode: "0700"
      loop: "{{ _client_rows }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Let restserver write into the repository root
      ansible.builtin.file:
        path: "{{ backup_root }}/{{ backup_restic_jail }}"
        state: directory
        owner: "{{ _restserver_pw.stdout.split(':')[2] }}"
        group: "{{ _restserver_pw.stdout.split(':')[3] }}"
        mode: "0755"

    # rest-server runs as one service user and enforces per-repo separation
    # itself via --private-repos, so there is no per-client unix account here.
    - name: Ensure the jail rc.conf.d exists
      ansible.builtin.file:
        path: "{{ _jail_root }}/etc/rc.conf.d"
        state: directory
        owner: root
        group: wheel
        mode: "0755"

    - name: Generate the htpasswd file
      ansible.builtin.template:
        src: htpasswd.j2
        dest: "{{ _jail_root }}/usr/local/etc/{{ backup_restic_service }}.htpasswd"
        # rest-server drops to its own account before reading this, so root-owned
        # 0600 makes it unreadable to the process that needs it.
        owner: "{{ _restserver_pw.stdout.split(':')[2] }}"
        group: "{{ _restserver_pw.stdout.split(':')[3] }}"
        mode: "0600"
      no_log: true
      notify: Restart rest-server

    - name: Configure rest-server
      ansible.builtin.template:
        src: rest-server.rc.j2
        dest: "{{ _jail_root }}/etc/rc.conf.d/{{ backup_restic_service }}"
        owner: root
        group: wheel
        mode: "0644"
        backup: true
      notify: Restart rest-server

    # Enabling in rc.conf starts nothing, and the restart handler only fires when
    # a config file changes in this run. Without this a freshly created jail has
    # rest-server enabled and not running, and the failure only shows up later
    # as a refused connection.
    - name: Check whether rest-server is running
      ansible.builtin.command: "jexec {{ backup_restic_jail }} service {{ backup_restic_service }} status"
      register: _restic_svc
      changed_when: false
      failed_when: false

    - name: Start rest-server
      ansible.builtin.command: "jexec {{ backup_restic_jail }} service {{ backup_restic_service }} start"
      changed_when: true
      when: _restic_svc.rc != 0

    - name: Confirm rest-server is running
      ansible.builtin.command: "jexec {{ backup_restic_jail }} service {{ backup_restic_service }} status"
      register: _restic_svc_after
      changed_when: false
      failed_when: _restic_svc_after.rc != 0
