---
backup_borg_enabled: true
backup_borg_jail: borg
# Empty means resolve from the repo at run time. The package is py<N>-borgbackup
# and N tracks whatever python the branch defaults to, so any pinned value goes
# stale on the next FreeBSD release. Set explicitly only to force one.
backup_borg_package: ""
# Host-side compaction. Append-only repos never shrink on their own: a client
# prune hides archives but reclaims nothing, so the host has to compact. There is
# no retention setting here because the host cannot prune: that needs the
# repository passphrase, which is the client's and stays the client's.
# 01:00, not 03:00: /etc/crontab runs `periodic daily` at 03:01, and the borg
# check in 520.backup-status wants the same exclusive repository lock. The loser
# of that race reports a healthy repo as FAILED.
backup_borg_compact_cron:
  minute: "0"
  hour: "1"
  weekday: "0"
