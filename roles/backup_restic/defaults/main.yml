---
backup_restic_enabled: true
backup_restic_jail: restic
# rc.d script name from the FreeBSD rest-server port. It is 'restserver', with
# no underscore, and every rc variable is prefixed with it.
backup_restic_service: restserver
# Service account the port creates. rest-server drops to it, so the data it
# writes must be owned by it.
backup_restic_user: restserver
backup_restic_port: 8000
# ponytail: plain HTTP, add TLS if this port ever gets a non-tailnet path.
# Plain HTTP on purpose. The only route to this port is the tailnet, which is
# already WireGuard-encrypted and authenticated end to end, and restic encrypts
# repository contents client-side regardless. Adding TLS here buys a cert
# lifecycle to maintain, not confidentiality. Flip this if the box ever gets a
# path that is not the tailnet.
backup_restic_tls: false

# How long `restic-maintenance open` leaves append-only off before an at(1) job
# puts it back. restic is the one ingest path whose retention loop does not
# close on its own: rest-server refuses the delete, so space is only ever
# reclaimed inside a window like this. Long enough for a prune over a slow link,
# short enough that a forgotten window shuts itself.
backup_restic_maintenance_minutes: 120
