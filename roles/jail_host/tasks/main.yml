---
- name: Prepare the host for jails
  when: jail_host_enabled | bool
  block:
    # lineinfile rather than sysrc, which is the convention everywhere else in
    # this chain: the sysrc module validates names as alphanumeric plus
    # underscore and rejects a dotted loader tunable, even though sysrc(8)
    # itself handles them.
    - name: Enable RACCT accounting at boot
      ansible.builtin.lineinfile:
        path: /boot/loader.conf
        regexp: '^kern\.racct\.enable='
        line: 'kern.racct.enable="1"'
        create: true
        owner: root
        group: wheel
        mode: "0644"
      when: jail_host_racct | bool

    # Jails sit on routed epairs, so the host forwards for them. base's
    # pf.conf.j2 notes a routing host must set this itself; base never does.
    - name: Enable IPv4 forwarding in rc.conf
      community.general.sysrc:
        name: gateway_enable
        value: "YES"

    - name: Enable IPv4 forwarding now
      ansible.posix.sysctl:
        name: net.inet.ip.forwarding
        value: "1"
        sysctl_file: /etc/sysctl.conf
        sysctl_set: true
        reload: false

    - name: Enable jails and rctl in rc.conf
      community.general.sysrc:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
      loop:
        - { name: jail_enable, value: "YES" }
        - { name: jail_parallel_start, value: "YES" }
        - { name: rctl_enable, value: "YES" }
        - { name: rctl_rules, value: "/etc/rctl.conf" }

    - name: Render /etc/rctl.conf
      ansible.builtin.template:
        src: rctl.conf.j2
        dest: /etc/rctl.conf
        owner: root
        group: wheel
        mode: "0644"
        backup: true
      notify: Reload rctl

    - name: Check whether RACCT is live in this kernel
      ansible.builtin.command: sysctl -n kern.racct.enable
      register: _racct
      changed_when: false
      failed_when: false

    # Not an assert: everything else in this play is still correct without racct,
    # and failing the run would be worse than saying so plainly.
    - name: Warn when the RACCT reboot is still pending
      ansible.builtin.debug:
        msg: >-
          kern.racct.enable is not active yet, so the rules in /etc/rctl.conf are
          not enforced. They take effect after the next reboot - which on this box
          means an unlock.sh round trip, so pick your moment.
      when: _racct.stdout | default('0') | trim != '1'
