---
- name: Configure the rsync/sftp ingest jail
  when: backup_rsync_enabled | bool
  vars:
    _jail_root: "{{ jail_dataset_mount }}/{{ backup_rsync_jail }}"
    _client_rows: "{{ backup_clients | selectattr('services', 'contains', 'rsync') | list }}"
    _clients: "{{ _client_rows | map(attribute='name') | list }}"
    _sftp_clients: >-
      {{ _client_rows | selectattr('transfer', 'defined')
         | selectattr('transfer', 'equalto', 'sftp') | list }}
    _rsync_clients: "{{ _client_rows | rejectattr('name', 'in', _sftp_clients | map(attribute='name') | list) | list }}"
  block:
    # python3 is not a dependency of the rsync package, but rrsync is a python
    # script, so without it the forced command dies with "not found" - which
    # looks like a missing rrsync rather than a missing interpreter.
    - name: Install rsync and its rrsync interpreter in the jail
      community.general.pkgng:
        name:
          - rsync
          - python3
        state: present
        rootdir: "{{ _jail_root }}"
      when: _rsync_clients | length > 0
      environment: "{{ jail_pkg_environment }}"
      register: _rsync_pkg

    # pkg -r writes the files but runs no post-install step inside the jail, so
    # the jail's linker hints never learn about /usr/local/lib. Without this,
    # anything linked against a package library dies with
    # "Shared object ... not found" even though the file is right there.
    - name: Refresh the jail linker hints
      ansible.builtin.command: "jexec {{ backup_rsync_jail }} /etc/rc.d/ldconfig restart"
      changed_when: true
      when: _rsync_pkg is changed

    # rrsync is what confines an rsync client to one path. Without it there is no
    # server-side restriction at all, so fail loudly rather than quietly shipping
    # an unrestricted forced command.
    # Run it rather than stat it. The file existing proves nothing: rrsync is a
    # python script, so a missing interpreter fails at exec time with "not
    # found" while the script sits right there.
    - name: Verify rrsync actually runs in the jail
      ansible.builtin.command: "jexec {{ backup_rsync_jail }} {{ backup_rsync_rrsync }}"
      register: _rrsync
      changed_when: false
      failed_when: false
      when: _rsync_clients | length > 0

    - name: Refuse to configure rsync clients without a working rrsync
      ansible.builtin.assert:
        that: "'not found' not in (_rrsync.stderr | default('') ~ _rrsync.stdout | default(''))"
        fail_msg: >-
          {{ backup_rsync_rrsync }} does not run inside the {{ backup_rsync_jail }}
          jail: {{ _rrsync.stderr | default('') | trim }}. rrsync is a python
          script, so this is usually a missing interpreter rather than a missing
          rrsync. Fix it, or set every client's transfer to 'sftp'.
        quiet: true
      when: _rsync_clients | length > 0

    # /bin/sh, not nologin: sshd runs a forced command as "$SHELL -c ...", so a
    # nologin shell answers "This account is currently not available" and the
    # forced command never runs. Confinement comes from the forced command and
    # `restrict` in authorized_keys, not from the shell.
    - name: Create or update a jail user per rsync client
      ansible.builtin.shell: |
        set -u
        root="{{ _jail_root }}"
        name="{{ item.name }}"
        if pw -R "$root" usershow "$name" > /dev/null 2>&1; then
            cur=$(pw -R "$root" usershow "$name" | cut -d: -f10)
            [ "$cur" = "/bin/sh" ] && exit 0
            pw -R "$root" usermod "$name" -s /bin/sh
            echo changed
        else
            pw -R "$root" useradd "$name" -u {{ item.uid }} \
               -d "/backups/${name}" -s /bin/sh -c "rsync client ${name}"
            echo changed
        fi
      register: _rsync_user
      changed_when: "'changed' in _rsync_user.stdout"
      loop: "{{ _client_rows }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create the sftp chroot roots
      ansible.builtin.file:
        path: "{{ backup_root }}/{{ backup_rsync_jail }}/{{ item.name }}"
        state: directory
        owner: root
        group: wheel
        mode: "0755"
      loop: "{{ _sftp_clients }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create the sftp writable subdirectories
      ansible.builtin.file:
        path: "{{ backup_root }}/{{ backup_rsync_jail }}/{{ item.name }}/data"
        state: directory
        owner: "{{ item.uid }}"
        group: "{{ item.uid }}"
        mode: "0700"
      loop: "{{ _sftp_clients }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create the rsync client directories
      ansible.builtin.file:
        path: "{{ backup_root }}/{{ backup_rsync_jail }}/{{ item.name }}"
        state: directory
        owner: "{{ item.uid }}"
        group: "{{ item.uid }}"
        mode: "0700"
      loop: "{{ _rsync_clients }}"
      loop_control:
        label: "{{ item.name }}"

    # root-owned, like the borg jail's. A client-owned .ssh would let the client
    # unlink and replace its own authorized_keys. rrsync and the sftp chroot both
    # confine clients elsewhere, so this is not reachable today, but the
    # restriction should not depend on that staying true.
    - name: Create the client .ssh directories
      ansible.builtin.file:
        path: "{{ _jail_root }}/home/{{ item.name }}/.ssh"
        state: directory
        owner: root
        group: wheel
        mode: "0755"
      loop: "{{ _client_rows }}"
      loop_control:
        label: "{{ item.name }}"

    # Kept in /home, not in the client's data directory: an sftp client owns its
    # data/ tree and must never be able to rewrite its own authorized_keys.
    - name: Install the per-client authorized_keys
      ansible.builtin.template:
        src: authorized_keys.j2
        dest: "{{ _jail_root }}/home/{{ item.name }}/.ssh/authorized_keys"
        owner: root
        group: wheel
        mode: "0644"
      loop: "{{ _client_rows }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        client: "{{ item }}"
      notify: Restart rsync sshd

    - name: Render the jail sshd config
      ansible.builtin.template:
        src: sshd_config.j2
        dest: "{{ _jail_root }}/etc/ssh/sshd_config"
        owner: root
        group: wheel
        mode: "0644"
        backup: true
      notify: Restart rsync sshd

    - name: Enable sshd in the jail
      community.general.sysrc:
        name: sshd_enable
        value: "YES"
        path: "{{ _jail_root }}/etc/rc.conf"
      notify: Restart rsync sshd

    # Enabling in rc.conf starts nothing, and the restart handler only fires when
    # a config file changes in this run. Without this a freshly created jail has
    # sshd enabled and not running, and the failure only shows up later as a
    # refused connection.
    - name: Check whether the jail sshd is running
      ansible.builtin.command: "jexec {{ backup_rsync_jail }} service sshd status"
      register: _rsync_svc
      changed_when: false
      failed_when: false

    - name: Start the jail sshd
      ansible.builtin.command: "jexec {{ backup_rsync_jail }} service sshd start"
      changed_when: true
      when: _rsync_svc.rc != 0

    - name: Confirm the jail sshd is running
      ansible.builtin.command: "jexec {{ backup_rsync_jail }} service sshd status"
      register: _rsync_svc_after
      changed_when: false
      failed_when: _rsync_svc_after.rc != 0
