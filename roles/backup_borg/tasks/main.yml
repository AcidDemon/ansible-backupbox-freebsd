---
- name: Configure the borg ingest jail
  when: backup_borg_enabled | bool
  vars:
    _jail_root: "{{ jail_dataset_mount }}/{{ backup_borg_jail }}"
    _client_rows: "{{ backup_clients | selectattr('services', 'contains', 'borg') | list }}"
    _clients: "{{ _client_rows | map(attribute='name') | list }}"
  block:
    - name: Resolve the borg package name from the repository
      ansible.builtin.shell: |
        set -u
        pkg -r "{{ _jail_root }}" search -q borgbackup 2>/dev/null |
            grep -E '^py[0-9]+-borgbackup-' | sort -V | tail -1 | sed 's/-[0-9][^-]*$//'
      register: _borg_search
      changed_when: false
      when: backup_borg_package | length == 0
      environment: "{{ jail_pkg_environment }}"

    - name: Settle on the borg package
      ansible.builtin.set_fact:
        borg_package: >-
          {{ backup_borg_package | default('', true)
             or _borg_search.stdout | default('') | trim }}

    - name: Refuse when no borg package can be resolved
      ansible.builtin.assert:
        that: borg_package is match('^py[0-9]+-borgbackup$')
        fail_msg: >-
          Could not find a py<N>-borgbackup package in the repository configured
          for {{ _jail_root }}. Set backup_borg_package explicitly.
        quiet: true

    - name: Install borg in the jail
      community.general.pkgng:
        name: "{{ borg_package }}"
        state: present
        # rootdir, not jail: pkg -j attaches into the jail and uses the jail's
        # network, which these jails deliberately do not have. pkg -r installs
        # into the jail root over the host's network instead.
        rootdir: "{{ _jail_root }}"
      environment: "{{ jail_pkg_environment }}"
      register: _borg_pkg

    # pkg -r writes the files but runs no post-install step inside the jail, so
    # the jail's linker hints never learn about /usr/local/lib. Without this,
    # anything linked against a package library dies with
    # "Shared object ... not found" even though the file is right there.
    - name: Refresh the jail linker hints
      ansible.builtin.command: "jexec {{ backup_borg_jail }} /etc/rc.d/ldconfig restart"
      changed_when: true
      when: _borg_pkg is changed

    # /bin/sh, not nologin: sshd runs a forced command as "$SHELL -c ...", so a
    # nologin shell answers "This account is currently not available" and the
    # forced command never runs. Confinement comes from the forced command and
    # `restrict` in authorized_keys, not from the shell.
    - name: Create or update a jail user per borg client
      ansible.builtin.shell: |
        set -u
        root="{{ _jail_root }}"
        name="{{ item.name }}"
        if pw -R "$root" usershow "$name" > /dev/null 2>&1; then
            cur=$(pw -R "$root" usershow "$name" | cut -d: -f10)
            [ "$cur" = "/bin/sh" ] && exit 0
            pw -R "$root" usermod "$name" -s /bin/sh
            echo changed
        else
            pw -R "$root" useradd "$name" -u {{ item.uid }} \
               -d "/backups/${name}" -s /bin/sh -c "borg client ${name}"
            echo changed
        fi
      register: _borg_user
      changed_when: "'changed' in _borg_user.stdout"
      loop: "{{ _client_rows }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Own the client repo directories
      ansible.builtin.file:
        path: "{{ backup_root }}/{{ backup_borg_jail }}/{{ item.name }}"
        state: directory
        owner: "{{ item.uid }}"
        group: "{{ item.uid }}"
        mode: "0700"
      loop: "{{ _client_rows }}"
      loop_control:
        label: "{{ item.name }}"

    # Earlier releases ran compact and check on the host as root: compact
    # rewrites the data segments, index, hints and integrity, check rewrites
    # config. Those runs took ownership of everything they wrote, and the client
    # could no longer use its own repository.
    # Both now run inside the jail as the client; this only repairs the boxes
    # that ran the old way.
    # ponytail: delete once no deployed box predates that change.
    - name: Repair repo files an old root-side borg run took ownership of
      ansible.builtin.shell: |
        find "{{ backup_root }}/{{ backup_borg_jail }}/{{ item.name }}" \
             ! -user {{ item.uid }} -print \
             -exec chown -h {{ item.uid }}:{{ item.uid }} {} +
      register: _borg_chown
      changed_when: _borg_chown.stdout | length > 0
      loop: "{{ _client_rows }}"
      loop_control:
        label: "{{ item.name }}"

    # Outside the client's repo directory: that tree is writable by the client,
    # and an authorized_keys a client can rewrite is not a restriction.
    - name: Create the client .ssh directories
      ansible.builtin.file:
        path: "{{ _jail_root }}/home/{{ item.name }}/.ssh"
        state: directory
        owner: root
        group: wheel
        mode: "0755"
      loop: "{{ _client_rows }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Install the per-client authorized_keys
      ansible.builtin.template:
        src: authorized_keys.j2
        dest: "{{ _jail_root }}/home/{{ item.name }}/.ssh/authorized_keys"
        owner: root
        group: wheel
        mode: "0644"
      loop: "{{ _client_rows }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        client: "{{ item }}"
      notify: Restart borg sshd

    - name: Render the jail sshd config
      ansible.builtin.template:
        src: sshd_config.j2
        dest: "{{ _jail_root }}/etc/ssh/sshd_config"
        owner: root
        group: wheel
        mode: "0644"
        backup: true
      notify: Restart borg sshd

    - name: Enable sshd in the jail
      community.general.sysrc:
        name: sshd_enable
        value: "YES"
        path: "{{ _jail_root }}/etc/rc.conf"
      notify: Restart borg sshd

    - name: Install the host-side compaction script
      ansible.builtin.template:
        src: borg-compact.sh.j2
        dest: /usr/local/sbin/borg-compact
        owner: root
        group: wheel
        mode: "0750"

    - name: Schedule host-side compaction
      ansible.builtin.cron:
        name: borg-compact
        user: root
        minute: "{{ backup_borg_compact_cron.minute }}"
        hour: "{{ backup_borg_compact_cron.hour }}"
        weekday: "{{ backup_borg_compact_cron.weekday }}"
        job: /usr/local/sbin/borg-compact

    # Enabling in rc.conf starts nothing, and the restart handler only fires when
    # a config file changes in this run. Without this a freshly created jail has
    # sshd enabled and not running, and the failure only shows up later as a
    # refused connection.
    - name: Check whether the jail sshd is running
      ansible.builtin.command: "jexec {{ backup_borg_jail }} service sshd status"
      register: _borg_svc
      changed_when: false
      failed_when: false

    - name: Start the jail sshd
      ansible.builtin.command: "jexec {{ backup_borg_jail }} service sshd start"
      changed_when: true
      when: _borg_svc.rc != 0

    - name: Confirm the jail sshd is running
      ansible.builtin.command: "jexec {{ backup_borg_jail }} service sshd status"
      register: _borg_svc_after
      changed_when: false
      failed_when: _borg_svc_after.rc != 0
