---
- name: Schedule host-owned snapshots
  when: backup_snapshots_enabled | bool
  block:
    - name: Install sanoid
      community.general.pkgng:
        name: sanoid
        state: present

    - name: Ensure the sanoid config directory exists
      ansible.builtin.file:
        path: /usr/local/etc/sanoid
        state: directory
        owner: root
        group: wheel
        mode: "0755"

    - name: Render sanoid.conf
      ansible.builtin.template:
        src: sanoid.conf.j2
        dest: /usr/local/etc/sanoid/sanoid.conf
        owner: root
        group: wheel
        mode: "0644"
        backup: true

    # --cron takes and prunes in one pass and decides internally what is due.
    # --quiet keeps the run silent unless something actually failed, which
    # matters because cron mails stdout and this runs four times an hour.
    - name: Schedule sanoid
      ansible.builtin.cron:
        name: sanoid
        user: root
        minute: "{{ backup_snapshots_cron_minute }}"
        job: "/usr/local/bin/sanoid --cron --quiet"

    # Left over from the zfsnap era. Removing the jobs stops new TTL-named
    # snapshots appearing; any that already exist are not destroyed here,
    # because silently deleting snapshots is exactly what this box exists to
    # prevent. Remove them by hand once you have looked at them.
    - name: Remove the superseded zfsnap cron jobs
      ansible.builtin.cron:
        name: "{{ item }}"
        user: root
        state: absent
      loop:
        - zfsnap-hourly
        - zfsnap-daily
        - zfsnap-monthly
        - zfsnap-destroy
