---
backup_network_enabled: true
backup_network_advertise_routes: "{{ jail_subnet }}"
# Tailscale on FreeBSD is userspace wireguard-go. On this box the 4TB spinning
# disk (~150-200 MB/s) is the bottleneck long before the tunnel is, so kernel
# if_wg is not worth a second overlay. Revisit only if measured.
backup_network_accept_dns: false
