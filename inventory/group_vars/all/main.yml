---
# ---------------------------------------------------------------------------
# Orchestrator vars. This repo is the top layer, so it sets the contract vars
# for base and hardening too - they are whole-value overrides, never merged.
# ---------------------------------------------------------------------------

admin_user: acid
deploy_user: ansible
admin_email: c.schlueter@acidnetworks.net

# Everything the box has to tell you goes to admin_email: the periodic daily,
# weekly, monthly and security runs (which carry 520.backup-status, aide, pkg
# audit and the ZFS scrub result), the daily security posture report, and the
# stdout of every root cron job, meaning borg-compact, jail-pkg-update,
# freebsd-auto-update and sanoid.
#
# Relaying through msmtp rather than leaving it to dma(8). dma would attempt
# direct SMTP from the VPS with no smarthost, so the mail is generated, refused
# or silently binned, and the box looks healthy while telling you nothing.
hardening_misc_msmtp: true
# The MX for acidnetworks.net. Verified reachable: 587 open, Haraka banner,
# STARTTLS advertised, which is what msmtprc's tls_starttls expects.
smtp_host: hydrus.uberspace.de
smtp_port: 587
# Must be a domain configured on the Uberspace account, or the relay refuses the
# envelope sender and every report is generated and dropped.
smtp_from: erebus@acidnetworks.net

target_users:
  - name: acid
    home: /home/acid

base_packages: [vim, git, tmux, curl, bash, htop, rsync, jq]

# --- backup box identity -----------------------------------------------------
backup_pool: backup
backup_root: /backup

# Each jail gets its own /24 on a routed epair. No shared bridge: jail-to-jail
# traffic would bypass pf on a bridge, and these jails need no outbound network
# at all (pkg -r installs into the jail root over the host's network), so
# inbound-only is
# both simpler and stricter.
jail_subnet: 10.100.0.0/16
jail_dataset: zroot/jails
# Empty means "match the host userland", which is what a thin jail needs.
# Set a version only to stage an upgrade: extract the new base, flip this,
# restart the jails, then clear it again once the host follows.
jail_base_version: ""

# Environment for pkg operations against a jail root. Normally empty. The escape
# hatch exists because FreeBSD builds a branch's packages against its newest
# release, so a host deliberately held at an older patch level sees
# "Newer FreeBSD version for package ..." and needs IGNORE_OSVERSION=yes.
jail_pkg_environment: {}

jails:
  - name: borg
    id: 1
    port: 22
  - name: restic
    id: 2
    port: 8000
  - name: rsync
    id: 3
    port: 22

# Host-side zfs recv listener. Its own sshd instance, deliberately not the host's:
# keeps the backup path clear of ssh_hardening, ssh_2fa and the at(1) rollback.
zrecv_port: 2222

# --- clients -----------------------------------------------------------------
# services: which ingest paths this client may use.
# quota:    hard ZFS quota for that client's datasets.
# max_age_hours: staleness threshold for the daily report / healthchecks ping.
# ssh_key:  public key, not a secret. Ping URLs and passwords live in vault.yml.
# uid:      pinned per client, never derived from list position. Jail users exist
#           only inside their jail, so the host chowns their data numerically;
#           a shifting uid would orphan every existing backup.
# transfer: rsync (rrsync forced command) or sftp (chrooted internal-sftp).
#           Only read when 'rsync' is in services.
backup_clients: []
#  - name: vinokur
#    uid: 5001
#    services: [borg, rsync, zrecv]
#    transfer: rsync
#    quota: 500G
#    max_age_hours: 26
#    ssh_key: "ssh-ed25519 AAAAC3Nza... vinokur"

# --- base_freebsd contract ---------------------------------------------------
# Tighten to specific tailnet addresses once the node IPs are known. Tailscale
# ACLs are the real per-client control; pf can only express per-port rules.
management_cidrs: ["100.64.0.0/10"]
firewall_service_cidrs: ["100.64.0.0/10"]
ssh_port: 22
firewall_allow_tcp: []            # nothing public, ever
firewall_allow_udp: []
firewall_allow_tcp_mgmt: ["{{ ssh_port }}"]
firewall_allow_tcp_svc: [22, 8000, "{{ zrecv_port }}"]
firewall_trust_iifnames: []       # epairs stay filtered; jails are inbound-only
firewall_forward_policy: forward  # tailnet -> jail /24s, see jail_host
firewall_anchors: []

# --- hardening_freebsd contract ----------------------------------------------
# harden.yml arms an at(1) job in pre_tasks that strips the sshd drop-ins if the
# play never disarms it. The 20-minute default is shorter than a first run: the
# crowdsec hub update, two network-bound collection installs and `aide --init`
# over a dozen directory trees with sha256+sha512 do not fit. Firing mid-play
# leaves a green run and an unhardened box, because ansible has already written
# the files it would need to rewrite.
harden_rollback_minutes: 90

ssh_allow_groups: [sshusers]
# zfsrecv uses its own sshd instance, so it needs neither of these. Listed as the
# documented place to put any future host-side service account.
ssh_allow_group_members:
  - "{{ admin_user }}"
  - "{{ deploy_user }}"
  - "{{ ansible_user | default(deploy_user) }}"
ssh_2fa_exempt_users: []
ssh_2fa_exempt_groups: []

# A jail's sshd logs to the jail's own auth.log, invisible to the host watchers.
# Spelled out rather than derived from `jails`: two entries do not justify a
# one-line comprehension nobody can read at 3am.
jail_dataset_mount: /jails
sshguard_log_paths:
  - /var/log/auth.log
  - /jails/borg/var/log/auth.log
  - /jails/rsync/var/log/auth.log
crowdsec_acquis_paths:
  - /jails/borg/var/log/auth.log
  - /jails/rsync/var/log/auth.log

chkrootkit_enabled: false   # daily filesystem walk, pointless over 4TB of backups
lynis_enabled: false        # runs inline on every play, costs minutes
