---
- name: Report on backup health
  when: backup_monitoring_enabled | bool
  block:
    - name: Ensure the periodic security drop-in dir exists
      ansible.builtin.file:
        path: "{{ backup_monitoring_script | dirname }}"
        state: directory
        owner: root
        group: wheel
        mode: "0755"

    - name: Install the backup status check
      ansible.builtin.template:
        src: 520.backup-status.j2
        dest: "{{ backup_monitoring_script }}"
        owner: root
        group: wheel
        # 0700, not 0755: the vaulted healthchecks ping URLs are rendered into
        # the script, and a ping URL is a bearer credential. periodic(8) runs
        # this as root, so nothing needs to read it.
        mode: "0700"
        validate: "/bin/sh -n %s"
      no_log: true   # healthchecks ping URLs are vaulted
