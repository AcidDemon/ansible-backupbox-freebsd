---
- name: Build the shared thin-jail base
  when: jail_base_enabled | bool
  block:
    # A thin jail runs this userland on the host's kernel, so by default take
    # the host's own version rather than trusting anyone to keep a pinned value
    # in step with it. Set jail_base_version only to stage an upgrade.
    - name: Read the host userland version
      ansible.builtin.command: freebsd-version -u
      register: _host_userland
      changed_when: false

    - name: Settle on the jail base version
      ansible.builtin.set_fact:
        jail_base: "{{ jail_base_version | default('', true) or _host_userland.stdout | trim }}"

    - name: Warn when the jail base is pinned away from the host version
      ansible.builtin.debug:
        msg: >-
          jail base is {{ jail_base }} but the host userland is
          {{ _host_userland.stdout | trim }}. That combination is only safe while
          you are staging an upgrade.
      when: jail_base != _host_userland.stdout | trim

    # jail_dataset defaults to zroot/jails, which silently assumes a ZFS root.
    # On a UFS-root host community.general.zfs fails with "missing pool name",
    # which says nothing useful about what to do next.
    - name: Check the pool holding the jail datasets
      ansible.builtin.command: "zpool list -H -o name {{ jail_dataset.split('/')[0] }}"
      register: _jail_pool
      changed_when: false
      failed_when: false

    - name: Refuse to build jails on a pool that does not exist
      ansible.builtin.assert:
        that: _jail_pool.rc == 0
        fail_msg: >-
          jail_dataset is {{ jail_dataset }} but pool
          '{{ jail_dataset.split('/')[0] }}' does not exist on this host. Point
          jail_dataset at a pool that does.
        quiet: true

    - name: Create the jails dataset
      community.general.zfs:
        name: "{{ jail_dataset }}"
        state: present
        extra_zfs_properties:
          mountpoint: "{{ jail_dataset_mount }}"

    - name: Create the versioned base dataset
      community.general.zfs:
        name: "{{ jail_dataset }}/base-{{ jail_base }}"
        state: present

    # A release directory has no CHECKSUM.SHA256. Integrity data lives in
    # MANIFEST, tab separated: name, sha256, file count, component, description,
    # default. Note an EOL release is removed from the mirror entirely, so this
    # 404s rather than serving a stale tree.
    - name: Fetch the release MANIFEST
      ansible.builtin.get_url:
        url: "{{ jail_base_mirror }}/{{ jail_base }}/MANIFEST"
        dest: "{{ jail_base_workdir }}/MANIFEST-{{ jail_base }}"
        mode: "0644"

    # No -F needed: awk splits on any whitespace, and the two fields we want
    # contain none.
    - name: Read the base.txz checksum from the MANIFEST
      ansible.builtin.command:
        argv:
          - awk
          - '$1 == "base.txz" { print $2 }'
          - "{{ jail_base_workdir }}/MANIFEST-{{ jail_base }}"
      register: _base_sha
      changed_when: false

    - name: Refuse a MANIFEST with no usable base.txz checksum
      ansible.builtin.assert:
        that: _base_sha.stdout | trim | length == 64
        fail_msg: >-
          No base.txz sha256 in the MANIFEST for {{ jail_base }}.
        quiet: true

    - name: Fetch base.txz
      ansible.builtin.get_url:
        url: "{{ jail_base_mirror }}/{{ jail_base }}/base.txz"
        dest: "{{ jail_base_workdir }}/base-{{ jail_base }}.txz"
        checksum: "sha256:{{ _base_sha.stdout | trim }}"
        mode: "0644"

    - name: Extract base.txz into the base dataset
      ansible.builtin.command:
        argv:
          - tar
          - -xpf
          - "{{ jail_base_workdir }}/base-{{ jail_base }}.txz"
          - -C
          - "{{ jail_dataset_mount }}/base-{{ jail_base }}"
        creates: "{{ jail_dataset_mount }}/base-{{ jail_base }}/bin/sh"

    # Updating means extracting a new version alongside and flipping
    # jail_base_version, not mutating this one.
    - name: Freeze the base dataset
      community.general.zfs:
        name: "{{ jail_dataset }}/base-{{ jail_base }}"
        state: present
        extra_zfs_properties:
          readonly: "on"

    - name: Install the jail package updater
      ansible.builtin.template:
        src: jail-pkg-update.sh.j2
        dest: /usr/local/sbin/jail-pkg-update
        owner: root
        group: wheel
        mode: "0755"

    - name: Schedule the jail package updater
      ansible.builtin.cron:
        name: jail-pkg-update
        user: root
        minute: "{{ jail_base_update_cron.minute }}"
        hour: "{{ jail_base_update_cron.hour }}"
        weekday: "{{ jail_base_update_cron.weekday }}"
        job: /usr/local/sbin/jail-pkg-update
